<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Christmas Chaos — TV</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  .tv-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 30px;
    background: rgba(0,0,0,0.3);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    flex-shrink: 0;
  }

  .tv-title { font-size: 2rem; color: var(--gold); letter-spacing: 1px; }
  .round-info { font-size: 1.1rem; font-weight: 700; color: var(--text-muted); }
  .turn-banner { font-size: 1.2rem; font-weight: 800; color: var(--gold); }

  .tv-body {
    display: flex;
    flex: 1;
    overflow: hidden;
    gap: 0;
  }

  /* Left: scoreboard */
  .tv-scores {
    width: 260px;
    flex-shrink: 0;
    padding: 20px 16px;
    background: rgba(0,0,0,0.25);
    border-right: 1px solid rgba(255,255,255,0.07);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .tv-scores h3 {
    font-family: 'Mountains of Christmas', cursive;
    font-size: 1.5rem;
    color: var(--gold);
    text-align: center;
    margin-bottom: 4px;
  }

  .tv-score-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    border-radius: 12px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    transition: all 0.4s;
  }

  .tv-score-row.active {
    background: rgba(244,196,48,0.18);
    border-color: var(--gold);
    transform: scale(1.03);
  }

  .tv-score-dot { width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; }
  .tv-score-name { flex: 1; font-weight: 700; font-size: 0.95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tv-score-pts { font-weight: 900; font-size: 1.2rem; color: var(--gold); }

  /* Right: wheel + challenge */
  .tv-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    gap: 20px;
    overflow: hidden;
  }

  /* Lobby screen */
  #lobby-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    text-align: center;
  }

  #lobby-screen h1 { font-size: 5rem; color: var(--gold); text-shadow: 0 0 40px rgba(244,196,48,0.5); }
  #lobby-screen p  { font-size: 1.5rem; color: var(--text-muted); }
  #lobby-qr        { font-size: 2rem; color: var(--text); font-weight: 700; }

  /* Wheel + challenge layout */
  #game-screen {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 40px;
    width: 100%;
  }

  .wheel-wrap { flex-shrink: 0; }

  /* Challenge panel (right of wheel) */
  #challenge-panel {
    flex: 1;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  #challenge-type-label {
    font-family: 'Mountains of Christmas', cursive;
    font-size: 2rem;
    text-align: center;
  }

  #challenge-text {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    padding: 24px;
    font-size: 1.3rem;
    line-height: 1.6;
    min-height: 100px;
  }

  #challenge-answer-box {
    background: rgba(244,196,48,0.12);
    border: 2px solid var(--gold);
    border-radius: 12px;
    padding: 16px 20px;
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--gold);
    text-align: center;
    display: none;
  }

  #challenge-answer-box.show { display: block; animation: bounceIn 0.4s ease; }

  /* Buzzer state */
  #buzzer-state {
    text-align: center;
    padding: 14px;
    border-radius: 12px;
    font-size: 1.1rem;
    font-weight: 700;
    display: none;
  }

  #buzzer-state.open  { display: block; background: rgba(244,196,48,0.15); border: 2px solid var(--gold); color: var(--gold); animation: pulse 1s ease infinite; }
  #buzzer-state.won   { display: block; background: rgba(26,122,60,0.2);  border: 2px solid var(--green); color: #6dffaa; }

  /* Spinning overlay */
  #spin-overlay {
    display: none;
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 2rem;
    font-family: 'Mountains of Christmas', cursive;
    color: var(--gold);
    animation: pulse 0.6s ease infinite;
  }

  #spin-overlay.show { display: block; }

  /* Game end */
  #end-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    text-align: center;
  }

  #end-screen h1 { font-size: 4rem; color: var(--gold); }
  .winner-row {
    font-size: 2rem;
    font-weight: 800;
    padding: 16px 32px;
    background: rgba(244,196,48,0.15);
    border: 2px solid var(--gold);
    border-radius: 16px;
    color: var(--gold);
  }

  #double-down-banner {
    display: none;
    text-align: center;
    padding: 12px 20px;
    background: rgba(26,82,118,0.4);
    border: 2px solid #2471a3;
    border-radius: 12px;
    color: #7ec8f7;
    font-weight: 700;
    font-size: 1rem;
  }

  #double-down-banner.show { display: block; }

  .hidden { display: none !important; }

  /* Dare card special styling */
  .dare-props {
    font-size: 0.9rem;
    color: var(--text-muted);
    margin-top: 8px;
    font-style: italic;
  }

  .sound-title {
    font-size: 1.8rem;
    font-weight: 900;
    color: var(--gold);
    text-align: center;
    margin-top: 8px;
  }

  .hotseat-progress {
    text-align: center;
    font-size: 0.9rem;
    color: var(--text-muted);
    font-weight: 600;
  }
</style>
</head>
<body>

<div class="snowflakes" id="snowflakes"></div>

<div class="tv-header">
  <span class="tv-title festive">🎄 Christmas Chaos</span>
  <span class="round-info" id="round-label">Waiting to start…</span>
  <span class="turn-banner" id="turn-banner"></span>
</div>

<div class="tv-body">
  <!-- Scores sidebar -->
  <div class="tv-scores">
    <h3>🏆 Scores</h3>
    <div id="scoreboard"></div>
  </div>

  <!-- Main area -->
  <div class="tv-main" style="position:relative;">

    <!-- Lobby -->
    <div id="lobby-screen">
      <h1>🎄 Christmas Chaos</h1>
      <p>Waiting for host to start the game…</p>
      <div id="lobby-qr">Players join at: <strong>/player</strong></div>
      <div id="lobby-teams" class="scoreboard" style="min-width:300px;"></div>
    </div>

    <!-- Active game -->
    <div id="game-screen" class="hidden">
      <div class="wheel-wrap">
        <div class="wheel-pointer">▼</div>
        <svg id="wheel-svg" viewBox="-110 -110 220 220" width="380" height="380"></svg>
      </div>

      <div id="challenge-panel">
        <div id="challenge-type-label"></div>
        <div id="double-down-banner" class="hidden">💫 DOUBLE DOWN IS ACTIVE! Next correct answer = 2× points!</div>
        <div id="challenge-text">Spin the wheel to begin!</div>
        <div id="challenge-answer-box"></div>
        <div id="buzzer-state"></div>

        <div class="hotseat-progress hidden" id="hotseat-progress"></div>

        <div class="dare-props hidden" id="dare-props"></div>

        <div class="sound-title hidden" id="sound-title"></div>
      </div>
    </div>

    <!-- End screen -->
    <div id="end-screen">
      <h1>🎉 Game Over!</h1>
      <div id="end-results"></div>
    </div>

    <div id="spin-overlay">🎡 Spinning…</div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let segments = [];
let currentWheelDeg = 0;
let spinning = false;

// ── Snowflakes ──
function makeSnowflakes() {
  const container = document.getElementById('snowflakes');
  const flakes = ['❄','❅','❆','✦'];
  for (let i = 0; i < 20; i++) {
    const el = document.createElement('div');
    el.className = 'snowflake';
    el.textContent = flakes[Math.floor(Math.random() * flakes.length)];
    el.style.left = Math.random() * 100 + '%';
    el.style.fontSize = (0.8 + Math.random() * 1.2) + 'rem';
    el.style.animationDuration = (8 + Math.random() * 12) + 's';
    el.style.animationDelay = (-Math.random() * 15) + 's';
    el.style.opacity = 0.2 + Math.random() * 0.4;
    container.appendChild(el);
  }
}
makeSnowflakes();

// ── Wheel ──
function buildWheel(segs) {
  segments = segs;
  const svg = document.getElementById('wheel-svg');
  const N = segs.length;
  const R = 100;
  const textR = 72;
  let html = '<g id="wheel-group">';
  for (let i = 0; i < N; i++) {
    const seg = segs[i];
    const startDeg = (i / N) * 360 - 90;
    const endDeg   = ((i + 1) / N) * 360 - 90;
    const startRad = startDeg * Math.PI / 180;
    const endRad   = endDeg   * Math.PI / 180;
    const midRad   = (startRad + endRad) / 2;
    const x1 = (R * Math.cos(startRad)).toFixed(3);
    const y1 = (R * Math.sin(startRad)).toFixed(3);
    const x2 = (R * Math.cos(endRad)).toFixed(3);
    const y2 = (R * Math.sin(endRad)).toFixed(3);
    const tx = (textR * Math.cos(midRad)).toFixed(3);
    const ty = (textR * Math.sin(midRad)).toFixed(3);
    const textRot = (midRad * 180 / Math.PI).toFixed(1);
    html += `<path d="M 0 0 L ${x1} ${y1} A ${R} ${R} 0 0 1 ${x2} ${y2} Z" fill="${seg.color}" stroke="rgba(255,255,255,0.3)" stroke-width="0.8"/>`;
    html += `<g transform="rotate(${textRot},${tx},${ty})">`;
    html += `<text x="${tx}" y="${parseFloat(ty)-5}" text-anchor="middle" font-size="12" fill="white">${seg.emoji}</text>`;
    // Split label on \n
    const lines = seg.label.split('\n');
    lines.forEach((line, li) => {
      html += `<text x="${tx}" y="${parseFloat(ty)+6+(li*8)}" text-anchor="middle" font-size="5.5" font-weight="bold" fill="rgba(255,255,255,0.9)">${line}</text>`;
    });
    html += `</g>`;
  }
  // Rim and center
  html += `<circle r="${R}" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>`;
  html += `<circle r="14" fill="#0a1628" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>`;
  html += `<text y="5" text-anchor="middle" font-size="13">🎄</text>`;
  html += '</g>';
  svg.innerHTML = html;
}

function spinToTarget(targetIndex, duration, onDone) {
  if (!segments.length) return;
  const N = segments.length;
  const segDeg = 360 / N;
  const offset = ((360 - ((targetIndex + 0.5) * segDeg % 360)) % 360);
  let targetDeg = Math.ceil((currentWheelDeg + 1440 - offset) / 360) * 360 + offset;
  if (targetDeg <= currentWheelDeg + 1080) targetDeg += 360;

  const startDeg = currentWheelDeg;
  const start = performance.now();
  const group = document.getElementById('wheel-group');

  spinning = true;
  document.getElementById('spin-overlay').classList.add('show');

  function frame(now) {
    const t = Math.min((now - start) / duration, 1);
    const eased = 1 - Math.pow(1 - t, 4);
    const deg = startDeg + (targetDeg - startDeg) * eased;
    if (group) group.setAttribute('transform', `rotate(${deg})`);
    if (t < 1) {
      requestAnimationFrame(frame);
    } else {
      currentWheelDeg = targetDeg;
      spinning = false;
      document.getElementById('spin-overlay').classList.remove('show');
      onDone && onDone();
    }
  }
  requestAnimationFrame(frame);
}

// ── UI helpers ──
function show(id)  { document.getElementById(id)?.classList.remove('hidden'); }
function hide(id)  { document.getElementById(id)?.classList.add('hidden'); }
function setText(id, t) { const el = document.getElementById(id); if (el) el.textContent = t; }
function setHtml(id, h) { const el = document.getElementById(id); if (el) el.innerHTML = h; }

function renderScoreboard(teams, currentTeamIndex) {
  const sb = document.getElementById('scoreboard');
  if (!sb || !teams) return;
  sb.innerHTML = teams.map((t, i) => `
    <div class="tv-score-row ${i === currentTeamIndex ? 'active' : ''}">
      <div class="tv-score-dot" style="background:${t.color}"></div>
      <span class="tv-score-name">${t.name}</span>
      <span class="tv-score-pts">${t.score}</span>
    </div>
  `).join('');
}

function showChallenge(segment, challenge, state) {
  const typeLabel = document.getElementById('challenge-type-label');
  const textEl    = document.getElementById('challenge-text');
  const answerBox = document.getElementById('challenge-answer-box');
  const dare_props = document.getElementById('dare-props');
  const soundTitle = document.getElementById('sound-title');
  const hotseatProg = document.getElementById('hotseat-progress');

  // Reset
  answerBox.classList.remove('show');
  dare_props.classList.add('hidden');
  soundTitle.classList.add('hidden');
  hotseatProg.classList.add('hidden');

  if (!segment || !challenge) {
    typeLabel.textContent = '';
    textEl.textContent = 'Waiting for next spin…';
    return;
  }

  typeLabel.textContent = `${segment.emoji} ${segment.label.replace('\n', ' ')}`;

  if (segment.type === 'dare') {
    textEl.innerHTML = `<strong>${challenge.title}</strong><br><br>${challenge.description}`;
    if (challenge.props?.length) {
      dare_props.textContent = '🎒 Props needed: ' + challenge.props.join(', ');
      dare_props.classList.remove('hidden');
    }
  } else if (segment.type === 'sounditout') {
    textEl.textContent = challenge.question || 'Hum or whistle this song!';
    soundTitle.textContent = `🎵 ${challenge.songTitle} — ${challenge.artist}`;
    soundTitle.classList.remove('hidden');
  } else if (segment.type === 'hotseat') {
    if (challenge) {
      textEl.textContent = challenge.question;
      hotseatProg.textContent = `Question ${state.hotSeatIndex + 1} of ${state.hotSeatTotal}`;
      hotseatProg.classList.remove('hidden');
    }
  } else if (segment.type === 'special') {
    if (segment.effect === 'steal') {
      textEl.textContent = 'Host: pick a team to STEAL 100 points from! 🎁';
    } else if (segment.effect === 'doubledown') {
      textEl.textContent = 'Next correct answer or completed dare is worth DOUBLE POINTS! 💫';
    }
  } else {
    // trivia / allplay
    textEl.textContent = challenge.question;
    if (challenge.hint) {
      textEl.innerHTML += `<br><span style="font-size:0.85rem;color:var(--text-muted)">Hint: ${challenge.hint}</span>`;
    }
  }

  if (state.answerRevealed && challenge.answer) {
    answerBox.textContent = '✓ ' + challenge.answer;
    answerBox.classList.add('show');
  }
}

function updateBuzzer(state) {
  const el = document.getElementById('buzzer-state');
  if (state.buzzerOpen) {
    el.className = 'open';
    el.textContent = '🔔 BUZZ IN NOW!';
  } else if (state.buzzerWinner) {
    el.className = 'won';
    el.textContent = `🏆 ${state.buzzerWinner.playerName} (${state.buzzerWinner.teamName}) buzzed in!`;
  } else {
    el.className = '';
    el.textContent = '';
  }
}

// ── Socket events ──
socket.on('wheel-segments', (segs) => buildWheel(segs));

socket.on('state-update', (state) => {
  renderScoreboard(state.teams, state.currentTeamIndex);

  // Round label
  if (state.phase === 'lobby') {
    setText('round-label', '');
    setText('turn-banner', '');
  } else if (state.phase !== 'gameend') {
    setText('round-label', `Round ${state.round} of ${state.totalRounds}`);
    const team = state.teams?.[state.currentTeamIndex];
    setText('turn-banner', team ? `${team.name}'s turn` : '');
  }

  // Double down banner
  const ddb = document.getElementById('double-down-banner');
  if (state.doubleDownActive) ddb.classList.remove('hidden');
  else ddb.classList.add('hidden');

  // Screens
  if (state.phase === 'lobby') {
    show('lobby-screen'); hide('game-screen'); hide('end-screen');
    // Render lobby teams
    const lt = document.getElementById('lobby-teams');
    if (lt && state.teams) {
      lt.innerHTML = state.teams.map(t => `
        <div class="score-row">
          <div class="score-dot" style="background:${t.color}"></div>
          <span class="score-name">${t.name}</span>
          <span class="score-pts">${state.players?.filter(p => p.teamIndex === t.index).length || 0} players</span>
        </div>
      `).join('');
    }
  } else if (state.phase === 'gameend') {
    hide('lobby-screen'); hide('game-screen'); show('end-screen');
  } else {
    hide('lobby-screen'); show('game-screen'); hide('end-screen');
    if (state.phase !== 'spinning' && state.currentChallenge) {
      showChallenge(state.currentSegment, state.currentChallenge, state);
    } else if (state.phase === 'playing' && !state.currentChallenge) {
      document.getElementById('challenge-type-label').textContent = '';
      document.getElementById('challenge-text').textContent = 'Spin the wheel!';
    }
    updateBuzzer(state);
  }
});

socket.on('spin-start', ({ segmentIndex }) => {
  document.getElementById('challenge-type-label').textContent = '';
  document.getElementById('challenge-text').textContent = '🎡 Spinning…';
  document.getElementById('buzzer-state').className = '';
  document.getElementById('buzzer-state').textContent = '';
  spinToTarget(segmentIndex, 5000, null);
});

socket.on('spin-result', ({ segment, challenge }) => {
  // Challenge will come via state-update
});

socket.on('answer-revealed', ({ answer }) => {
  const ab = document.getElementById('challenge-answer-box');
  ab.textContent = '✓ ' + answer;
  ab.classList.add('show');
});

socket.on('buzzer-winner', (winner) => {
  const el = document.getElementById('buzzer-state');
  el.className = 'won';
  el.textContent = `🏆 ${winner.playerName} (${winner.teamName}) buzzed in!`;
});

socket.on('hotseat-question', ({ question, index, total }) => {
  document.getElementById('challenge-text').textContent = question.question;
  document.getElementById('hotseat-progress').textContent = `Question ${index + 1} of ${total}`;
  document.getElementById('challenge-answer-box').classList.remove('show');
});

socket.on('round-start', ({ round, totalRounds }) => {
  setText('round-label', `Round ${round} of ${totalRounds}`);
});

socket.on('turn-start', ({ teamName }) => {
  setText('turn-banner', `${teamName}'s turn`);
});

socket.on('game-end', ({ teams }) => {
  hide('lobby-screen'); hide('game-screen'); show('end-screen');
  const medals = ['🥇','🥈','🥉'];
  setHtml('end-results', teams.map((t, i) => `
    <div class="winner-row" style="border-color:${t.color}; color:${t.color}">
      ${medals[i] || `${i+1}.`} ${t.name} — ${t.score} pts
    </div>
  `).join(''));
});
</script>
</body>
</html>
