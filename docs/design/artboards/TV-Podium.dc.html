<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TV — Final results</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&amp;family=Lilita+One&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFC93C}a:hover{color:#FFE08A}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; background: #0B1F17; color: #FFF6E5; font-family: 'Fredoka', sans-serif; position: relative; overflow: hidden; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; padding: 56px 72px 48px">

  <div style="position: absolute; inset: 0; pointer-events: none" aria-hidden="true">
    <sc-for list="{{ confetti }}" as="c" hint-placeholder-count="40">
      <span style="position: absolute; left: {{ c.x }}px; top: {{ c.y }}px; width: {{ c.w }}px; height: {{ c.h }}px; background: {{ c.color }}; border-radius: {{ c.r }}; transform: rotate({{ c.rot }}deg); opacity: 0.9"></span>
    </sc-for>
  </div>

  <span style="position: relative; font-size: 24px; font-weight: 600; letter-spacing: 0.18em; color: #B8CCBF">FINAL RESULTS</span>
  <h1 style="position: relative; margin: 10px 0 0; font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 104px; line-height: 1; color: #FFC93C; text-align: center">Team Rudolph wins Christmas!</h1>

  <div style="position: relative; flex: 1; min-height: 0; width: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 28px; margin-top: 36px">

    <div style="width: 380px; display: flex; flex-direction: column; align-items: center; gap: 16px">
      <span style="width: 104px; height: 104px; border-radius: 50%; background: #7EE081; display: flex; align-items: center; justify-content: center"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#0B1F17" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m17 14 3 3.3a1 1 0 0 1-.7 1.7H4.7a1 1 0 0 1-.7-1.7L7 14h-.3a1 1 0 0 1-.7-1.7L9 9h-.2A1 1 0 0 1 8 7.3L12 3l4 4.3a1 1 0 0 1-.8 1.7H15l3 3.3a1 1 0 0 1-.7 1.7H17Z"></path><path d="M12 22v-3"></path></svg></span>
      <span style="font-family: 'Lilita One', sans-serif; font-size: 44px">The Grinches</span>
      <div style="width: 100%; height: 250px; border-radius: 28px 28px 0 0; background: #1B4636; border: 3px solid rgba(255,246,229,0.14); border-bottom: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; box-sizing: border-box">
        <span style="font-family: 'Lilita One', sans-serif; font-size: 96px; line-height: 1; color: #DDE6E0">2</span>
        <span style="font-family: 'Lilita One', sans-serif; font-size: 44px">2,100</span>
      </div>
    </div>

    <div style="width: 420px; display: flex; flex-direction: column; align-items: center; gap: 16px">
      <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#FFC93C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.734H5.81a1 1 0 0 1-.957-.734L2.02 6.02a.5.5 0 0 1 .798-.519l4.276 3.664a1 1 0 0 0 1.516-.294z"></path><path d="M5 21h14"></path></svg>
      <span style="width: 128px; height: 128px; border-radius: 50%; background: #FF5A4E; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 8px rgba(255,201,60,0.35)"><svg width="68" height="68" viewBox="0 0 24 24" fill="none" stroke="#0B1F17" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"></path></svg></span>
      <span style="font-family: 'Lilita One', sans-serif; font-size: 52px">Team Rudolph</span>
      <div style="width: 100%; height: 340px; border-radius: 28px 28px 0 0; background: #FFC93C; color: #0B1F17; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
        <span style="font-family: 'Lilita One', sans-serif; font-size: 128px; line-height: 1">1</span>
        <span style="font-family: 'Lilita One', sans-serif; font-size: 56px">2,850</span>
      </div>
    </div>

    <div style="width: 380px; display: flex; flex-direction: column; align-items: center; gap: 16px">
      <span style="width: 104px; height: 104px; border-radius: 50%; background: #B794FF; display: flex; align-items: center; justify-content: center"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#0B1F17" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1"></rect><path d="M12 8v13"></path><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"></path><path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"></path></svg></span>
      <span style="font-family: 'Lilita One', sans-serif; font-size: 44px">Naughty List</span>
      <div style="width: 100%; height: 190px; border-radius: 28px 28px 0 0; background: #1B4636; border: 3px solid rgba(255,246,229,0.14); border-bottom: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; box-sizing: border-box">
        <span style="font-family: 'Lilita One', sans-serif; font-size: 88px; line-height: 1; color: #E8B98A">3</span>
        <span style="font-family: 'Lilita One', sans-serif; font-size: 40px">1,700</span>
      </div>
    </div>
  </div>

  <div style="position: relative; width: 100%; display: flex; gap: 24px; padding-top: 28px; border-top: 3px solid rgba(255,246,229,0.12)">
    <div style="flex: 1; display: flex; align-items: center; gap: 18px; padding: 20px 24px; border-radius: 22px; background: #123326">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#FFC93C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"></path></svg>
      <div style="display: flex; flex-direction: column"><span style="font-size: 18px; font-weight: 600; letter-spacing: 0.14em; color: #B8CCBF">FASTEST FINGER</span><span style="font-size: 30px; font-weight: 600">Priya · 6 buzzes won</span></div>
    </div>
    <div style="flex: 1; display: flex; align-items: center; gap: 18px; padding: 20px 24px; border-radius: 22px; background: #123326">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#FFC93C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 11h.01"></path><path d="M14 6h.01"></path><path d="M18 6h.01"></path><path d="M6.5 13.1h.01"></path><path d="M22 5c0 9-4 12-6 12s-6-3-6-12c0-2 2-3 6-3s6 1 6 3"></path><path d="M17.4 9.9c-.8.8-2 .8-2.8 0"></path><path d="M10.1 7.1C9 7.2 7.7 7.7 6 8.6c-3.5 2-4.7 3.9-3.7 5.6 4.5 7.8 9.5 8.4 11.2 7.4.9-.5 1.9-2.1 1.9-4.7"></path><path d="M9.1 16.5c.3-1.1 1.4-1.7 2.4-1.4"></path></svg>
      <div style="display: flex; flex-direction: column"><span style="font-size: 18px; font-weight: 600; letter-spacing: 0.14em; color: #B8CCBF">STAR PERFORMER</span><span style="font-size: 30px; font-weight: 600">Aunt Linda · 3 dares</span></div>
    </div>
    <div style="flex: 1.4; display: flex; align-items: center; gap: 28px; padding: 20px 24px; border-radius: 22px; background: #123326; font-size: 26px">
      <span><span style="color: #B8CCBF">4</span>  Jingle Bell Rockers <strong style="font-family: 'Lilita One', sans-serif; font-weight: 400">1,350</strong></span>
      <span><span style="color: #B8CCBF">5</span>  Elf Help <strong style="font-family: 'Lilita One', sans-serif; font-weight: 400">900</strong></span>
      <span><span style="color: #B8CCBF">6</span>  Frosty’s Crew <strong style="font-family: 'Lilita One', sans-serif; font-weight: 400">650</strong></span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const colors = ['#FF5A4E', '#FFC93C', '#7EE081', '#5AC8FA', '#B794FF', '#FFF6E5', '#FF7AB6'];
    const confetti = [];
    for (let i = 0; i < 46; i++) {
      const x = (i * 197 + (i % 5) * 61) % 1880;
      const y = (i * 113 + (i % 7) * 37) % 420;
      const round = i % 4 === 0;
      confetti.push({
        x, y,
        w: round ? 14 : 10 + (i % 3) * 4,
        h: round ? 14 : 22 + (i % 4) * 4,
        r: round ? '50%' : '3px',
        rot: (i * 47) % 180,
        color: colors[i % colors.length],
      });
    }
    return { confetti };
  }
}
</script>
</body>
</html>
