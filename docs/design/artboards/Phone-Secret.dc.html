<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone — Secret card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&amp;family=Lilita+One&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFC93C}a:hover{color:#FFE08A}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #0B1F17; color: #FFF6E5; font-family: 'Fredoka', sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative; box-sizing: border-box">

  <header style="height: 64px; flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 20px; box-sizing: border-box; border-bottom: 2px solid rgba(255,246,229,0.08)">
    <div style="display: flex; align-items: center; gap: 10px; min-width: 0">
      <span style="width: 36px; height: 36px; border-radius: 50%; background: #FF5A4E; display: flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B1F17" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"></path></svg></span>
      <span style="font-size: 18px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Team Rudolph</span>
    </div>
    <span style="display: flex; align-items: center; gap: 6px; font-family: 'Lilita One', sans-serif; font-size: 24px; line-height: 1" aria-label="Team score 1,150, in the lead">1,150<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFC93C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.734H5.81a1 1 0 0 1-.957-.734L2.02 6.02a.5.5 0 0 1 .798-.519l4.276 3.664a1 1 0 0 0 1.516-.294z"></path><path d="M5 21h14"></path></svg></span>
  </header>

  <main style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; padding: 20px 20px 24px; box-sizing: border-box">

    <span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; background: #F5B82E; color: #1A1206; font-weight: 600; font-size: 13px; letter-spacing: 0.1em; padding: 7px 14px 7px 10px; border-radius: 999px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1206" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 11h.01"></path><path d="M14 6h.01"></path><path d="M18 6h.01"></path><path d="M6.5 13.1h.01"></path><path d="M22 5c0 9-4 12-6 12s-6-3-6-12c0-2 2-3 6-3s6 1 6 3"></path><path d="M17.4 9.9c-.8.8-2 .8-2.8 0"></path><path d="M10.1 7.1C9 7.2 7.7 7.7 6 8.6c-3.5 2-4.7 3.9-3.7 5.6 4.5 7.8 9.5 8.4 11.2 7.4.9-.5 1.9-2.1 1.9-4.7"></path><path d="M9.1 16.5c.3-1.1 1.4-1.7 2.4-1.4"></path></svg>
      DARE · SILENT MOVIE STAR
    </span>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 36px; line-height: 1.05">Only you can see this</h1>
      <p style="margin: 0; font-size: 17px; line-height: 1.35; color: #B8CCBF">Aunt Linda, you’re the performer. Keep your screen turned away from your team.</p>
    </div>

    <sc-if value="{{ hidden }}" hint-placeholder-val="{{ true }}">
      <button type="button" onClick="{{ reveal }}" aria-pressed="false" aria-label="Secret card, hidden. Hold to peek at your movie." style="position: relative; width: 100%; height: 352px; flex: none; margin: 0 0 8px; border: none; border-radius: 28px; padding: 0; box-sizing: border-box; cursor: pointer; font-family: 'Fredoka', sans-serif; color: #1A1206; background: repeating-linear-gradient(135deg, #F5B82E 0px, #F5B82E 22px, #EFAA1C 22px, #EFAA1C 44px); box-shadow: 0 8px 0 #A87412; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px">
        <span style="position: absolute; top: 14px; right: 14px; bottom: 14px; left: 14px; border-radius: 20px; border: 3px dashed rgba(26,18,6,0.28)" aria-hidden="true"></span>
        <span style="position: absolute; top: 30px; left: 50%; transform: translateX(-50%); background: #0B1F17; color: #FFC93C; font-weight: 600; font-size: 13px; letter-spacing: 0.14em; padding: 6px 14px; border-radius: 999px; white-space: nowrap">FOR YOUR EYES ONLY</span>
        <span style="width: 108px; height: 108px; margin-top: 30px; border-radius: 50%; background: #0B1F17; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 8px rgba(11,31,23,0.16)">
          <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#FFC93C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </span>
        <span style="font-family: 'Lilita One', sans-serif; font-size: 42px; line-height: 1">Hold to peek</span>
        <span style="font-size: 16px; font-weight: 500; color: #3D2A08">Tilt your phone toward you first</span>
      </button>
    </sc-if>

    <sc-if value="{{ revealed }}" hint-placeholder-val="{{ false }}">
      <button type="button" onClick="{{ hide }}" aria-pressed="true" aria-label="Your movie is Home Alone. Act it out with no words and no sounds. Tap to hide it." style="position: relative; width: 100%; height: 352px; flex: none; margin: 0 0 8px; border: none; border-radius: 28px; padding: 24px 24px 18px; box-sizing: border-box; cursor: pointer; font-family: 'Fredoka', sans-serif; color: #0B1F17; background: #FFF6E5; box-shadow: 0 8px 0 #CDBB97; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px">
        <span style="display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; letter-spacing: 0.14em; color: #7A4A00">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7A4A00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M7 3v18"></path><path d="M3 7.5h4"></path><path d="M3 12h18"></path><path d="M3 16.5h4"></path><path d="M17 3v18"></path><path d="M17 7.5h4"></path><path d="M17 16.5h4"></path></svg>
          YOUR MOVIE
        </span>
        <span style="flex: 1; display: flex; align-items: center; font-family: 'Lilita One', sans-serif; font-size: 76px; line-height: 0.95; letter-spacing: 0.5px">Home<br>Alone</span>
        <span style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 18px; background: #F5E6C8; box-sizing: border-box; text-align: left">
          <span style="width: 40px; height: 40px; border-radius: 50%; background: #D42F2F; display: flex; align-items: center; justify-content: center; flex: none">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"></path><line x1="22" x2="16" y1="9" y2="15"></line><line x1="16" x2="22" y1="9" y2="15"></line></svg>
          </span>
          <span style="font-size: 19px; font-weight: 700; line-height: 1.2">Act it out — no words, no sounds!</span>
        </span>
        <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; color: #4A5A50">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4A5A50" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"></path><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"></path><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"></path><path d="m2 2 20 20"></path></svg>
          Tap the card to hide it
        </span>
      </button>
    </sc-if>

    <div style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 22px; background: #123326; border: 2px solid rgba(255,246,229,0.10)">
      <span style="width: 44px; height: 44px; border-radius: 50%; background: #1B4636; display: flex; align-items: center; justify-content: center; flex: none">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFC93C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="10" x2="14" y1="2" y2="2"></line><line x1="12" x2="15" y1="14" y2="11"></line><circle cx="12" cy="14" r="8"></circle></svg>
      </span>
      <span style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
        <span style="font-size: 18px; font-weight: 600; line-height: 1.25">When you’re ready, tell the host to start the timer</span>
        <span style="font-size: 15px; color: #B8CCBF">Nail it for 200 points</span>
      </span>
    </div>

    <sc-if value="{{ revealed }}" hint-placeholder-val="{{ false }}">
      <button type="button" onClick="{{ hide }}" style="width: 100%; height: 60px; flex: none; border-radius: 18px; border: 2px solid rgba(255,246,229,0.14); background: #1B4636; color: #FFF6E5; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 20px; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFF6E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"></path><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"></path><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"></path><path d="m2 2 20 20"></path></svg>
        Hide it again
      </button>
    </sc-if>

    <sc-if value="{{ hidden }}" hint-placeholder-val="{{ true }}">
      <p style="margin: 0; height: 60px; flex: none; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; color: #B8CCBF">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B8CCBF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle></svg>
        Peek as many times as you need
      </p>
    </sc-if>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const revealed = this.state?.revealed ?? false;
    return {
      revealed,
      hidden: !revealed,
      reveal: () => this.setState({ revealed: true }),
      hide: () => this.setState({ revealed: false }),
    };
  }
}
</script>
</body>
</html>
