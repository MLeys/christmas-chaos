<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone — Join a team</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&amp;family=Lilita+One&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFC93C}a:hover{color:#FFE08A}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #0B1F17; color: #FFF6E5; font-family: 'Fredoka', sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative; box-sizing: border-box">

  <header style="height: 64px; flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 20px; box-sizing: border-box; border-bottom: 2px solid rgba(255,246,229,0.08)">
    <div style="display: flex; align-items: center; gap: 10px; min-width: 0">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFC93C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="2" x2="22" y1="12" y2="12"></line><line x1="12" x2="12" y1="2" y2="22"></line><path d="m20 16-4-4 4-4"></path><path d="m4 8 4 4-4 4"></path><path d="m16 4-4 4-4-4"></path><path d="m8 20 4-4 4 4"></path></svg>
      <span style="font-family: 'Lilita One', sans-serif; font-size: 24px; letter-spacing: 0.3px; white-space: nowrap">Christmas Chaos</span>
    </div>
    <span style="flex: none; font-size: 13px; font-weight: 600; letter-spacing: 0.12em; padding: 6px 12px; border-radius: 999px; background: #123326; border: 2px solid rgba(255,246,229,0.12); color: #B8CCBF">13 PLAYERS IN</span>
  </header>

  <main style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 18px; padding: 18px 20px 20px; box-sizing: border-box">

    <h1 style="margin: 0; font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 36px; line-height: 1.05">Join the game</h1>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px">
        <label for="player-name" style="font-size: 14px; font-weight: 600; letter-spacing: 0.12em; color: #B8CCBF">YOUR NAME</label>
        <span style="font-size: 14px; color: #B8CCBF">Shown on the TV</span>
      </div>
      <input id="player-name" type="text" value="Aunt Linda" maxlength="16" autocomplete="nickname" style="height: 58px; width: 100%; box-sizing: border-box; padding: 0 18px; border-radius: 18px; background: #123326; border: 2px solid rgba(255,246,229,0.20); color: #FFF6E5; font-family: 'Fredoka', sans-serif; font-size: 22px; font-weight: 600">
    </div>

    <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px">
      <h2 id="team-heading" style="margin: 0; font-size: 22px; font-weight: 600; line-height: 1.15">Pick your team</h2>

      <div role="group" aria-labelledby="team-heading" style="flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 14px 12px">

        <button type="button" onClick="{{ pickGrinches }}" aria-pressed="{{ tiles.grinches.pressed }}" style="position: relative; min-height: 0; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; text-align: left; padding: 14px 14px 18px; border: none; border-radius: 22px; background: #7EE081; color: #0B1F17; font-family: 'Fredoka', sans-serif; cursor: pointer; box-sizing: border-box; box-shadow: {{ tiles.grinches.shadow }}; transform: {{ tiles.grinches.lift }}">
          <span style="width: 46px; height: 46px; border-radius: 50%; background: rgba(11,31,23,0.14); display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0B1F17" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m17 14 3 3.3a1 1 0 0 1-.7 1.7H4.7a1 1 0 0 1-.7-1.7L7 14h-.3a1 1 0 0 1-.7-1.7L9 9h-.2A1 1 0 0 1 8 7.3L12 3l4 4.3a1 1 0 0 1-.8 1.7H15l3 3.3a1 1 0 0 1-.7 1.7H17Z"></path><path d="M12 22v-3"></path></svg></span>
          <span style="display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 19px; font-weight: 700; line-height: 1.1">The Grinches</span>
            <span style="font-size: 15px; font-weight: 500">2 players</span>
          </span>
          <sc-if value="{{ tiles.grinches.on }}" hint-placeholder-val="{{ false }}">
            <span style="position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 50%; background: #FFC93C; border: 3px solid #0B1F17; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B1F17" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>
          </sc-if>
        </button>

        <button type="button" onClick="{{ pickJingle }}" aria-pressed="{{ tiles.jingle.pressed }}" style="position: relative; min-height: 0; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; text-align: left; padding: 14px 14px 18px; border: none; border-radius: 22px; background: #FFC93C; color: #0B1F17; font-family: 'Fredoka', sans-serif; cursor: pointer; box-sizing: border-box; box-shadow: {{ tiles.jingle.shadow }}; transform: {{ tiles.jingle.lift }}">
          <span style="width: 46px; height: 46px; border-radius: 50%; background: rgba(11,31,23,0.14); display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0B1F17" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg></span>
          <span style="display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 19px; font-weight: 700; line-height: 1.1">Jingle Bell Rockers</span>
            <span style="font-size: 15px; font-weight: 500">2 players</span>
          </span>
          <sc-if value="{{ tiles.jingle.on }}" hint-placeholder-val="{{ false }}">
            <span style="position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 50%; background: #FFC93C; border: 3px solid #0B1F17; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B1F17" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>
          </sc-if>
        </button>

        <button type="button" onClick="{{ pickRudolph }}" aria-pressed="{{ tiles.rudolph.pressed }}" style="position: relative; min-height: 0; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; text-align: left; padding: 14px 14px 18px; border: none; border-radius: 22px; background: #FF5A4E; color: #0B1F17; font-family: 'Fredoka', sans-serif; cursor: pointer; box-sizing: border-box; box-shadow: {{ tiles.rudolph.shadow }}; transform: {{ tiles.rudolph.lift }}">
          <span style="width: 46px; height: 46px; border-radius: 50%; background: rgba(11,31,23,0.14); display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0B1F17" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"></path></svg></span>
          <span style="display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 19px; font-weight: 700; line-height: 1.1">Team Rudolph</span>
            <span style="font-size: 15px; font-weight: 500">3 players</span>
          </span>
          <sc-if value="{{ tiles.rudolph.on }}" hint-placeholder-val="{{ true }}">
            <span style="position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 50%; background: #FFC93C; border: 3px solid #0B1F17; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B1F17" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>
          </sc-if>
        </button>

        <button type="button" onClick="{{ pickElf }}" aria-pressed="{{ tiles.elf.pressed }}" style="position: relative; min-height: 0; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; text-align: left; padding: 14px 14px 18px; border: none; border-radius: 22px; background: #5AC8FA; color: #0B1F17; font-family: 'Fredoka', sans-serif; cursor: pointer; box-sizing: border-box; box-shadow: {{ tiles.elf.shadow }}; transform: {{ tiles.elf.lift }}">
          <span style="width: 46px; height: 46px; border-radius: 50%; background: rgba(11,31,23,0.14); display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0B1F17" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.7 21a2 2 0 0 1-3.5-2l8.6-14a6 6 0 0 1 10.4 6 2 2 0 1 1-3.464-2 2 2 0 1 0-3.464-2Z"></path><path d="M17.75 7 15 2.1"></path><path d="M10.9 4.8 13 9"></path><path d="m7.9 9.7 2 4.4"></path><path d="M4.9 14.7 7 18.9"></path></svg></span>
          <span style="display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 19px; font-weight: 700; line-height: 1.1">Elf Help</span>
            <span style="font-size: 15px; font-weight: 500">2 players</span>
          </span>
          <sc-if value="{{ tiles.elf.on }}" hint-placeholder-val="{{ false }}">
            <span style="position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 50%; background: #FFC93C; border: 3px solid #0B1F17; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B1F17" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>
          </sc-if>
        </button>

        <button type="button" onClick="{{ pickNaughty }}" aria-pressed="{{ tiles.naughty.pressed }}" style="position: relative; min-height: 0; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; text-align: left; padding: 14px 14px 18px; border: none; border-radius: 22px; background: #B794FF; color: #0B1F17; font-family: 'Fredoka', sans-serif; cursor: pointer; box-sizing: border-box; box-shadow: {{ tiles.naughty.shadow }}; transform: {{ tiles.naughty.lift }}">
          <span style="width: 46px; height: 46px; border-radius: 50%; background: rgba(11,31,23,0.14); display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0B1F17" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1"></rect><path d="M12 8v13"></path><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"></path><path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"></path></svg></span>
          <span style="display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 19px; font-weight: 700; line-height: 1.1">Naughty List</span>
            <span style="font-size: 15px; font-weight: 500">4 players</span>
          </span>
          <sc-if value="{{ tiles.naughty.on }}" hint-placeholder-val="{{ false }}">
            <span style="position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 50%; background: #FFC93C; border: 3px solid #0B1F17; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B1F17" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>
          </sc-if>
        </button>

        <button type="button" onClick="{{ pickFrosty }}" aria-pressed="{{ tiles.frosty.pressed }}" style="position: relative; min-height: 0; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; text-align: left; padding: 14px 14px 18px; border: none; border-radius: 22px; background: #3DDBC4; color: #0B1F17; font-family: 'Fredoka', sans-serif; cursor: pointer; box-sizing: border-box; box-shadow: {{ tiles.frosty.shadow }}; transform: {{ tiles.frosty.lift }}">
          <span style="width: 46px; height: 46px; border-radius: 50%; background: rgba(11,31,23,0.14); display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0B1F17" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="2" x2="22" y1="12" y2="12"></line><line x1="12" x2="12" y1="2" y2="22"></line><path d="m20 16-4-4 4-4"></path><path d="m4 8 4 4-4 4"></path><path d="m16 4-4 4-4-4"></path><path d="m8 20 4-4 4 4"></path></svg></span>
          <span style="display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 19px; font-weight: 700; line-height: 1.1">Frosty’s Crew</span>
            <span style="font-size: 15px; font-weight: 500">Be the first!</span>
          </span>
          <sc-if value="{{ tiles.frosty.on }}" hint-placeholder-val="{{ false }}">
            <span style="position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 50%; background: #FFC93C; border: 3px solid #0B1F17; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B1F17" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>
          </sc-if>
        </button>

      </div>
    </div>

    <button type="button" onClick="{{ join }}" aria-disabled="{{ btn.disabled }}" style="flex: none; width: 100%; height: 68px; margin-bottom: 6px; border: none; border-radius: 20px; background: {{ btn.bg }}; color: {{ btn.color }}; box-shadow: {{ btn.shadow }}; font-family: 'Fredoka', sans-serif; font-size: 23px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: {{ btn.cursor }}; box-sizing: border-box">
      <sc-if value="{{ btn.done }}" hint-placeholder-val="{{ false }}">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>
      </sc-if>
      <span>{{ btn.label }}</span>
      <sc-if value="{{ btn.ready }}" hint-placeholder-val="{{ true }}">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
      </sc-if>
    </button>

  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const team = this.state?.team ?? 'rudolph';
    const joined = this.state?.joined ?? false;
    const teams = {
      grinches: { name: 'The Grinches', color: '#7EE081', lip: '#4FA853' },
      jingle: { name: 'Jingle Bell Rockers', color: '#FFC93C', lip: '#C99418' },
      rudolph: { name: 'Team Rudolph', color: '#FF5A4E', lip: '#C23B31' },
      elf: { name: 'Elf Help', color: '#5AC8FA', lip: '#2D93C4' },
      naughty: { name: 'Naughty List', color: '#B794FF', lip: '#7F5FD1' },
      frosty: { name: 'Frosty’s Crew', color: '#3DDBC4', lip: '#1FA693' },
    };
    const lipInset = 'inset 0 -6px 0 rgba(11,31,23,0.22)';
    const tiles = {};
    Object.keys(teams).forEach((id) => {
      const on = team === id;
      tiles[id] = {
        on: on,
        pressed: on ? 'true' : 'false',
        shadow: on ? lipInset + ', 0 0 0 4px #0B1F17, 0 0 0 8px #FFC93C' : lipInset,
        lift: on ? 'translateY(-3px)' : 'none',
      };
    });

    const pick = (id) => () => {
      const current = this.state?.team ?? 'rudolph';
      this.setState({ team: current === id ? 'none' : id, joined: false });
    };
    const join = () => {
      const current = this.state?.team ?? 'rudolph';
      if (current === 'none') return;
      this.setState({ team: current, joined: true });
    };

    const chosen = teams[team];
    let btn;
    if (!chosen) {
      btn = { label: 'Pick a team to join', bg: '#1B4636', color: '#B8CCBF', shadow: 'none', cursor: 'default', disabled: 'true', ready: false, done: false };
    } else if (joined) {
      btn = { label: 'You’re in! Opening the lobby…', bg: '#2FB36B', color: '#0B1F17', shadow: '0 6px 0 #1B7A45', cursor: 'default', disabled: 'false', ready: false, done: true };
    } else {
      btn = { label: 'Join ' + chosen.name, bg: chosen.color, color: '#0B1F17', shadow: '0 6px 0 ' + chosen.lip, cursor: 'pointer', disabled: 'false', ready: true, done: false };
    }

    return {
      tiles: tiles,
      btn: btn,
      join: join,
      pickGrinches: pick('grinches'),
      pickJingle: pick('jingle'),
      pickRudolph: pick('rudolph'),
      pickElf: pick('elf'),
      pickNaughty: pick('naughty'),
      pickFrosty: pick('frosty'),
    };
  }
}
</script>
</body>
</html>
